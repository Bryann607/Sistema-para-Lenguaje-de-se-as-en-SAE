name: Publicar en GitHub Pages

# Se publica SOLO el módulo de usuario (index.html + modelo + contenido).
# admin.html, la grabación de datos, el entrenamiento y los datasets NO se suben al sitio
# público: el entrenamiento se hace en tu laptop y aquí solo llega el modelo ya entrenado.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Armar el sitio público (sin administración)
        run: python3 tools/armar_sitio.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
